<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadion Mini - Skor Langsung</title>
<style>
  :root { --bg:#eef2f0; --ink:#13201b; --muted:#5d6b66; --board:#0d1512; --boardInk:#f2f7f4;
          --a:#3aa0ff; --b:#ff7a45; --ok:#2fbf71; --idle:#7b8984; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a100e; --ink:#e6eee9; --muted:#93a39b; --board:#131d19; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:16px/1.5 "Segoe UI", system-ui, sans-serif; display:flex; align-items:center; justify-content:center; }
  main { width:100%; max-width:720px; padding:20px 14px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--muted); margin-bottom:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--idle); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .board { background:var(--board); color:var(--boardInk); border-radius:18px; padding:22px 14px 26px; text-align:center;
           box-shadow:0 8px 28px rgba(0,0,0,.25); }
  .board h1 { margin:0 0 18px; font-size:1rem; letter-spacing:.35em; font-weight:600; opacity:.8; }
  .row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; }
  .tim small { display:block; letter-spacing:.2em; font-size:.8rem; opacity:.75; }
  .skor { font-size:clamp(4.5rem, 24vw, 9rem); font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; }
  #a .skor { color:var(--a); } #b .skor { color:var(--b); }
  .sep { font-size:clamp(2rem, 9vw, 4rem); opacity:.5; }
  .skor.flash { animation:gol .9s ease-out; }
  @keyframes gol { 0% { transform:scale(1.35); filter:brightness(1.8); } 100% { transform:scale(1); filter:none; } }
  @media (prefers-reduced-motion: reduce) { .skor.flash { animation:none; } }
  #info { margin-top:16px; min-height:1.5em; font-size:.95rem; opacity:.85; }
  .btn { display:block; margin:16px auto 0; padding:10px 22px; border:1px solid var(--muted); border-radius:10px;
         background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
  .btn:hover:not(:disabled) { border-color:var(--b); color:var(--b); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:focus-visible { outline:2px solid var(--a); outline-offset:2px; }
  .foot { text-align:center; margin-top:12px; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <span><span class="dot" id="dot"></span><span id="conn">Menyambung...</span></span>
    <span id="dev">Alat: belum ada kabar</span>
  </div>

  <section class="board" aria-live="polite">
    <h1>STADION MINI</h1>
    <div class="row">
      <div class="tim" id="a"><small>TIM A</small><div class="skor" id="sa">0</div></div>
      <div class="sep">-</div>
      <div class="tim" id="b"><small>TIM B</small><div class="skor" id="sb">0</div></div>
    </div>
    <div id="info">Menunggu skor dari alat...</div>
  </section>
  <div class="foot" id="last">Pembaruan terakhir: -</div>
  <button class="btn" id="reset" disabled>Reset skor</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  // Kode unik tetap, harus sama persis dengan KODE_UNIK di scoreboard_mini.ino
  const KODE   = "SB-4e8d2a";
  const BROKER = "wss://broker.emqx.io:8084/mqtt";   // wss:// wajib karena halaman memakai HTTPS
  const $ = (id) => document.getElementById(id);
  let skorLama = { a: null, b: null };

  const jam = () => new Date().toLocaleTimeString("id-ID");

  function flash(id) {
    const el = $(id);
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }

  function tampil(d) {
    const a = Number(d.a), b = Number(d.b);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return;
    $("sa").textContent = a;
    $("sb").textContent = b;
    if (skorLama.a !== null) {
      if (a > skorLama.a) { flash("sa"); $("info").textContent = "GOL untuk Tim A!"; }
      else if (b > skorLama.b) { flash("sb"); $("info").textContent = "GOL untuk Tim B!"; }
      else if (a === 0 && b === 0 && (skorLama.a || skorLama.b)) $("info").textContent = "Skor direset";
    } else {
      $("info").textContent = a === 0 && b === 0 ? "Pertandingan belum dimulai" : "Skor terkini";
    }
    skorLama = { a, b };
    $("last").textContent = "Pembaruan terakhir: " + jam();
  }

  function setConn(ok, text) {
    $("dot").classList.toggle("on", ok);
    $("conn").textContent = text;
    $("reset").disabled = !ok;
  }

  const client = mqtt.connect(BROKER, {
    clientId: "web-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000, connectTimeout: 10000
  });
  client.on("connect", () => {
    setConn(true, "Tersambung");
    client.subscribe("scoreboard/" + KODE + "/#");
  });
  client.on("reconnect", () => setConn(false, "Menyambung ulang..."));
  client.on("offline", () => setConn(false, "Terputus"));
  client.on("message", (topic, payload) => {
    const jenis = topic.split("/").pop();
    const teks = payload.toString();
    if (jenis === "online") { $("dev").textContent = "Alat: " + (teks === "online" ? "menyala" : "mati"); return; }
    if (jenis === "skor") { try { tampil(JSON.parse(teks)); } catch (e) {} }
  });

  $("reset").addEventListener("click", () => {
    if (!client.connected) return;
    if (!confirm("Reset skor kedua tim menjadi 0 - 0?")) return;
    client.publish("scoreboard/" + KODE + "/cmd", "reset");
    $("info").textContent = "Perintah reset dikirim ke alat...";
  });
</script>
</body>
</html>
